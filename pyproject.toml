[project]
name = "skillforge-agent"
version = "0.1.0"
description = "Distill tutorials into validated, executable agent skills and serve them over MCP."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
# YouTube acquisition also needs ffmpeg on PATH (and optionally openai-whisper).
youtube = ["yt-dlp>=2026.8.19"]
books = ["pymupdf>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
skillforge = "skillforge_cli:main"

[tool.setuptools]
py-modules = ["skillforge_cli"]
packages = ["core", "core.sources", "runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_reference", ".venv", "runs", "build", "dist"]
pythonpath = ["."]
